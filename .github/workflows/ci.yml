name: KubeHealer CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Formatting & Static Analysis
        run: |
          go vet ./...

      - name: Run Unit Tests with Race Detector
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Binary
        run: |
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/kubehealer ./cmd/kubehealer
